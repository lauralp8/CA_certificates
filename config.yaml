# ============================================================================
# NETAPP ONTAP CONFIGURATION FILE
# ============================================================================
# Configuration file for NetApp ONTAP automation scripts
# Version: 1.0.0
# ============================================================================

# CONFIGURACIÓN DE CONEXIÓN AL CLÚSTER
cluster:
  host: cluster1.demo.netapp.com         
  username: admin
  password: Netapp1!

# CONFIGURACIÓN SVM
svm:
  name: svm_1_cluster

# CONFIGURACIÓN DE CERTIFICADOS (CSR)
certificate:
  common_name: SVMv2-RHOSO_COR_NAS01-NAS.es-north-1.cc.vdc.adm
  size: 2048  # Tamaño en bits (2048, 3072, 4096)
  algorithm: RSA
  hash_function: SHA256
  extended_key_usage:
    - serverAuth
    - clientAuth
  country: ES
  state: BARCELONA
  locality: BARCELONA 
  dns_name: SVMv2-RHOSO_COR_NAS01-NAS.es-north-1.cc.vdc.adm
  
  # Campos opcionales:
  # organization: My Organization
  # organizational_unit: IT Department
  # email: admin@example.com
  # ip: 
  #   - 10.0.0.1
  # uri:
  #   - https://example.com
  # key_usage:
  #   - digitalSignature
  #   - keyEncipherment
  
  # INSTALACIÓN DE CERTIFICADOS 
  cert_name: rhoso 
  type: server  

  # Path to your certificate files
  public_certificate_file: public_certificate.crt
  private_key_file: private_key.key

# CONFIGURACIÓN DE SSL
ssl:
  ca_name: vdc-ca  # CA name for the certificate
  server_enabled: true  # Enable or disable SSL server (true/false)




