# ============================================================================
# NETAPP ONTAP CONFIGURATION FILE
# ============================================================================
# Configuration file for NetApp ONTAP automation scripts
# Version: 1.0.0
# ============================================================================

# CLUSTER CONNECTION SETTINGS
cluster:
  host: cluster1.demo.netapp.com            
  username: admin
  password: "Netapp1!"

# STORAGE VIRTUAL MACHINE (SVM) SETTINGS
svm:
  name: svm_1_cluster

# SSL CONFIGURATION SETTINGS (for certificate modification)
ssl:
  ca_name: vdc-ca  # CA name for the certificate
  server_enabled: true  # Enable or disable SSL server (true/false)

# CERTIFICATE SIGNING REQUEST (CSR) SETTINGS
certificate:
  common_name: certificate 
  size: 2048  # Key size in bits (2048, 3072, 4096)
  algorithm: RSA
  hash_function: SHA256
  extended_key_usage:
    - serverAuth
    - clientAuth
  country: ES
  state: CORUNA
  locality: CORUNA
  dns_name: certificate
  
  # Optional fields:
  # organization: My Organization
  # organizational_unit: IT Department
  # email: admin@example.com
  # ip: 
  #   - 10.0.0.1
  # uri:
  #   - https://example.com
  # key_usage:
  #   - digitalSignature
  #   - keyEncipherment
  
  # CERTIFICATE INSTALLATION SETTINGS (for option [2])
  # Specify paths to certificate files (relative or absolute)
  cert_name: rhoso  # Name for the certificate in ONTAP
  type: server  # Certificate type (server, client, client-ca, server-ca, root-ca)
  
  # Path to your certificate files
  public_certificate_file: public_certificate.crt
  private_key_file: private_key.key


